name: CD Thomas

on:
  push:
    branches:
      - main
    paths:
      - Thomas/**
      - .github/workflows/cd_thomas.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Thomas
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Thomas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar secreto de Neon
        id: neon_secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta configurar el secreto NEON_DATABASE_URL. Se omiten migraciones y seed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar migraciones
        if: steps.neon_secret.outputs.configured == 'true'
        run: alembic upgrade head

      - name: Ejecutar seeders
        if: steps.neon_secret.outputs.configured == 'true'
        run: python -m scripts.seed