name: CI

on:
  push:
    branches: [ "main", "principal", "feat-cicd-maria", "feat-maria" ]
  pull_request:
    branches: [ "main", "principal" ]

permissions:
  contents: read

jobs:
  # Job para tus compañeros (Juanda, Thomas y Mauricio)
  quality-equipo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Juanda, Thomas, Mauricio]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pylint

      - name: Ejecutar Pylint
        run: >-
          pylint src main.py
          --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring
          --fail-under=8.0

      - name: Ejecutar Pytest
        if: matrix.project == 'Thomas'
        run: python -m pytest -q

      - name: Construir imagen Docker
        if: matrix.project == 'Thomas'
        run: docker build --tag animales-api:${{ matrix.project }} .

  # Job específico para Maria (tu módulo)
  quality-maria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r Maria/requirements.txt pylint pytest httpx

      - name: Ejecutar Pylint en Maria
        env:
          PYTHONPATH: Maria
        run: |
          pylint Maria/src Maria/main.py --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring --fail-under=8.0

      # 1. Ejecutar las 10 pruebas automatizadas con Pytest (Punto 1 y 2)
      - name: Ejecutar pruebas con pytest
        env:
          PYTHONPATH: Maria
        run: |
          pytest Maria/test_videojuegos.py

      # 2. Construir la imagen Docker para verificar empaquetamiento en la nube (Punto 3)
      - name: Construir imagen Docker de Maria
        run: |
          docker build -t api-videojuegos:latest Maria/
