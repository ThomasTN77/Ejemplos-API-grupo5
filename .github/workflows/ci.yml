name: CI

on:
  push:
  pull_request:
    branches: [ "main", "principal", "feat-cicd-maria", "feat-maria" ]
  pull_request:
    branches: [ "main", "principal" ]

permissions:
  contents: read

jobs:
  quality:
  # Job para tus compañeros (Juanda, Thomas y Mauricio)
  quality-equipo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Juanda, Thomas, Mauricio]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pylint

      - name: Ejecutar pruebas Pytest de motos
        if: matrix.project == 'Juanda'
        env:
          DATABASE_URL: sqlite://
        run: python -m pytest -q

      - name: Ejecutar Pylint
        run: >-
          pylint src main.py
          --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring
          --fail-under=8.0

      - name: Construir imagen Docker de motos
        if: matrix.project == 'Juanda'
        run: docker build --tag api-motos:ci .

      - name: Probar API dentro del contenedor
        if: matrix.project == 'Juanda'
        run: |
          docker run --detach --name api-motos-ci --publish 8000:8000 \
            --env DATABASE_URL=sqlite:////tmp/motos.db api-motos:ci
          trap 'docker rm --force api-motos-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:8000/motos
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs api-motos-ci
              exit 1
            fi
            sleep 1
          done
      - name: Ejecutar Pytest
        if: matrix.project == 'Thomas'
        run: python -m pytest -q

      - name: Construir imagen Docker
        if: matrix.project == 'Thomas'
        run: docker build --tag animales-api:${{ matrix.project }} .

  # Job específico para Maria (tu módulo)
  quality-maria:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r Maria/requirements.txt pylint pytest httpx

      - name: Ejecutar Pylint en Maria
        env:
          PYTHONPATH: Maria
        run: |
          pylint Maria/src Maria/main.py --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring --fail-under=8.0

      # 1. Ejecutar las 10 pruebas automatizadas con Pytest (Punto 1 y 2)
      - name: Ejecutar pruebas con pytest
        env:
          PYTHONPATH: Maria
        run: |
          pytest Maria/test_videojuegos.py

      # 2. Construir la imagen Docker para verificar empaquetamiento en la nube (Punto 3)
      - name: Construir imagen Docker de Maria
        run: |
          docker build -t api-videojuegos:latest Maria/
