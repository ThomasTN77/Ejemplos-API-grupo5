name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Juanda, Thomas, Mauricio]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pylint

      - name: Ejecutar pruebas Pytest de motos
        if: matrix.project == 'Juanda'
        env:
          DATABASE_URL: sqlite://
        run: python -m pytest -q

      - name: Ejecutar Pylint
        run: >-
          pylint src main.py
          --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring
          --fail-under=8.0

      - name: Construir imagen Docker de motos
        if: matrix.project == 'Juanda'
        run: docker build --tag api-motos:ci .

      - name: Probar API dentro del contenedor
        if: matrix.project == 'Juanda'
        run: |
          docker run --detach --name api-motos-ci --publish 8000:8000 \
            --env DATABASE_URL=sqlite:////tmp/motos.db api-motos:ci
          trap 'docker rm --force api-motos-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:8000/motos
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs api-motos-ci
              exit 1
            fi
            sleep 1
          done
