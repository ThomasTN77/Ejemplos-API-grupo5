name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Juanda, Thomas, Mauricio]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pylint

      - name: Ejecutar Pylint
        run: >-
          pylint src main.py
          --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring
          --fail-under=8.0
