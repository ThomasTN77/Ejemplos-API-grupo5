name: CI Pipeline

on:
  pull_request:
    branches: [ "main", "principal" ]
  push:
    branches: [ "main", "principal" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
     name: Checkout del código
      uses: actions/checkout@v3

     name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

     name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f api_videojuegos/requirements.txt ]; then pip install -r api_videojuegos/requirements.txt; fi

     name: Ejecutar Pylint
      run: |
        pylint --fail-under=5 $(git ls-files '*.py') || true

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Juanda, Thomas]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
       name: Descargar codigo
        uses: actions/checkout@v4

       name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

       name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pylint

       name: Ejecutar Pylint
        run: >-
          pylint src main.py
          --disable=import-error,missing-module-docstring,missing-function-docstring,missing-class-docstring
          --fail-under=8.0
 main
